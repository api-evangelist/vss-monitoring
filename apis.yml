name: VSS Monitoring
description: >-
  VSS Monitoring was a network packet broker (NPB) vendor founded in 2003,
  known for its vBroker appliance range and the vMesh architecture that meshed
  up to 256 packet brokers into a fault-tolerant network-visibility fabric for
  monitoring and security tools. It was acquired by Danaher Corporation in 2012
  as part of Tektronix Communications, and passed to NETSCOUT Systems when
  NETSCOUT acquired Danaher's Communications business (Tektronix Communications,
  Arbor Networks, parts of Fluke Networks) for roughly USD 2.6 billion, closing
  in July 2015. VSS Monitoring no longer operates as an independent company or
  brand; its packet-broker technology is now delivered as a NETSCOUT business
  unit, and it exposes no independent public developer program, API, SDK, or
  developer portal. This profile was surfaced as a portfolio-company lead and
  is retained for network completeness rather than as an active API provider.
